name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 依存ライブラリは無いので npm install は不要（node:test だけで動く）
      - name: テストを実行
        run: npm test
      - name: スクリプトの構文チェック
        run: for f in js/*.js; do node --check "$f"; done
